<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Rotation Break Tracker</title>
<style>:root{--bg:#0b1220;--panel:#111827;--panel2:#172033;--text:#f8fafc;--muted:#94a3b8;--border:#263248;--accent:#7c3aed;--blue:#2563eb;--good:#16a34a;--warn:#f59e0b;--danger:#dc2626;--shadow:0 18px 45px rgba(0,0,0,.28);--radius:20px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:var(--text);min-height:100vh}button,input,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:18px 14px 90px}header{display:flex;justify-content:space-between;gap:12px;margin:8px 0 18px}.brand{display:flex;align-items:center;gap:12px}.bt-logo{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;font-weight:1000;color:#fff;background:linear-gradient(135deg,#2563eb,#3b82f6)}h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:0}.sub,.muted{color:var(--muted)}.small{font-size:.78rem}.pill{background:#1e293b;border:1px solid var(--border);padding:8px 12px;border-radius:999px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:1.55rem}.stat span{color:var(--muted);font-size:.82rem}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;position:sticky;top:0;z-index:5;background:#0b1220e8;padding:8px 0 12px}nav button,.primary,.secondary,.danger{border:0;border-radius:14px;padding:12px;font-weight:900;color:white}nav button{background:#111827;border:1px solid var(--border);color:#cbd5e1}nav button.active,.primary{background:var(--accent)}.secondary{background:#243049}.danger{background:#451a1a;color:#fecaca}.section{display:none}.section.active{display:block}.panel+.panel{margin-top:14px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel-title h2{margin:0;font-size:1.05rem}.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.member,.repair-card{background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:15px}.member{display:flex;flex-direction:column;gap:12px;min-height:190px}.member-top,.repair-meta,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.member-top{justify-content:space-between}.name{font-weight:900;font-size:1.1rem}.job-badge,.repair-pill,.type-pill{display:inline-flex;width:max-content;border-radius:999px;padding:6px 9px;font-size:.78rem;font-weight:900}.job-badge{background:#2563eb29;color:#93c5fd}.repair-pill{background:#f59e0b24;color:#fcd34d}.type-pill.short{background:#16a34a2e;color:#86efac}.type-pill.long{background:#7c3aed33;color:#c4b5fd}.status{font-size:.72rem;font-weight:900}.rot{color:#fcd34d}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}input,textarea,select{width:100%;background:#0f172a;color:white;border:1px solid #334155;border-radius:14px;padding:12px}label{display:block;color:#cbd5e1;font-size:.85rem;font-weight:800;margin-bottom:6px}.field{margin-bottom:12px}.modal-backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50;padding:10px}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);background:#111827;border:1px solid var(--border);border-radius:24px;padding:18px;max-height:90vh;overflow:auto}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.big-rotation{font-size:1.6rem;letter-spacing:.18em;text-align:center;font-weight:900}.repair-card{margin-top:10px}.repair-summary{line-height:1.45;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:28px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{padding:20px 12px;min-height:110px}.choice b{display:block;font-size:1.05rem;margin-bottom:6px}.member-list{display:grid;gap:8px}.manage-row{background:var(--panel2);padding:12px;border-radius:14px;margin-bottom:8px}.edited{color:#c4b5fd;font-size:.72rem;font-weight:800}.recap{display:grid;gap:10px;background:#0f172a;border:1px solid #334155;border-radius:18px;padding:14px}.recap-row{display:flex;justify-content:space-between;gap:12px}.recap-row span{color:var(--muted)}.recap-total{font-size:1.1rem;color:#fcd34d;font-weight:900;border-top:1px solid #334155;padding-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}.table-wrap{overflow:auto}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.choice-grid,.filters{grid-template-columns:1fr}nav button{font-size:.68rem}}</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"></head><body><div class="app"><header><div class="brand"><div class="bt-logo">BT</div><div><h1>Rotation Break Tracker</h1><div class="sub">Breaks, jobs and repair events by plant rotation</div></div></div><div class="pill" id="liveTime"></div></header><div class="stats"><div class="stat"><span>Currently Out</span><b id="outCount">0</b></div><div class="stat"><span>Breaks Today</span><b id="todayCount">0</b></div><div class="stat"><span>Break Rotations</span><b id="todayRotations">0</b></div><div class="stat"><span>Repairs Today</span><b id="repairCount">0</b></div></div><nav><button class="active" data-tab="team">Team</button><button data-tab="today">Today</button><button data-tab="repairs">Repairs</button><button data-tab="history">History</button><button data-tab="manage">Manage</button></nav>
<section id="team" class="section active"><div class="panel"><div class="panel-title"><h2>Your Team</h2></div><div id="teamGrid" class="team-grid"></div></div></section><section id="today" class="section"><div class="panel"><h2>Today's Breaks</h2><div id="todayList"></div></div></section>
<section id="repairs" class="section"><div class="panel"><div class="panel-title"><div><h2>Repair Tracker</h2><div class="muted small">Quick events or extended downtime</div></div><button class="primary" onclick="addRepair()">+ Add Repair</button></div><div class="filters"><div><label>Date</label><input type="date" id="repairDateFilter"></div><div><label>Issue search</label><input id="repairSearch" placeholder="Search issue"></div></div><div id="repairList"></div><div id="repairEmpty" class="empty">No repair events recorded.</div></div><div class="panel"><button class="secondary" onclick="exportRepairsCSV()">Export Repairs CSV</button></div></section>
<section id="history" class="section"><div class="panel"><h2>Break History</h2><div id="historyList"></div></div></section><section id="manage" class="section"><div class="panel"><h2>Manage Team</h2><div class="field"><label>Add team member</label><input id="newMemberName" placeholder="Enter name"></div><button class="primary" onclick="addMember()">Add</button><div id="memberList" class="member-list" style="margin-top:12px"></div></div><div class="panel"><div class="toolbar"><button class="secondary" onclick="exportCSV()">Export Breaks CSV</button><button class="secondary" onclick="exportRepairsCSV()">Export Repairs CSV</button><button class="secondary" onclick="exportBackup()">Backup JSON</button></div></div></section></div><div id="modalBackdrop" class="modal-backdrop"><div class="modal"><h3 id="modalTitle"></h3><div id="modalContent"></div></div></div>
<script>const TEAM_KEY='rotationBreakTeamV1',BREAKS_KEY='rotationBreakRecordsV1',ACTIVE_KEY='rotationBreakActiveV1',REPAIRS_KEY='rotationRepairRecordsV1';let team=JSON.parse(localStorage.getItem(TEAM_KEY)||'null')||[];team=team.map(m=>({...m,job:m.job||''}));let breaks=JSON.parse(localStorage.getItem(BREAKS_KEY)||'[]'),activeBreaks=JSON.parse(localStorage.getItem(ACTIVE_KEY)||'{}'),repairs=JSON.parse(localStorage.getItem(REPAIRS_KEY)||'[]');const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function save(){localStorage.setItem(TEAM_KEY,JSON.stringify(team));localStorage.setItem(BREAKS_KEY,JSON.stringify(breaks));localStorage.setItem(ACTIVE_KEY,JSON.stringify(activeBreaks));localStorage.setItem(REPAIRS_KEY,JSON.stringify(repairs))}function localDateKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function validRotation(v){return /^\d{4}$/.test(v)}function rotationDiff(s,e){s=+s;e=+e;if(s>=6000&&e>=6000)return(e-s+4000)%4000;return(e-s+10000)%10000}function closeModal(){$('#modalBackdrop').classList.remove('show')}function openModal(t,h){$('#modalTitle').textContent=t;$('#modalContent').innerHTML=h;$('#modalBackdrop').classList.add('show')}$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};function getMember(id){return team.find(x=>x.id===id)}
function startBreak(id){const m=getMember(id);openModal('Start break · '+m.name,`<div class="field"><label>Starting rotation</label><input id="startRotation" class="big-rotation" maxlength="4" inputmode="numeric"></div><div class="field"><label>Notes</label><textarea id="startNotes"></textarea></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmStart('${id}')">Start Break</button></div>`)}function confirmStart(id){const r=$('#startRotation').value.trim();if(!validRotation(r))return alert('Enter exactly 4 digits.');activeBreaks[id]={startRotation:r,job:getMember(id).job||'',notes:$('#startNotes').value,startedAt:new Date().toISOString()};save();closeModal();render()}function endBreak(id){const a=activeBreaks[id];openModal('End break',`<p>Started at <b>${a.startRotation}</b></p><div class="field"><label>Ending rotation</label><input id="endRotation" class="big-rotation" maxlength="4" inputmode="numeric"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmEnd('${id}')">Save Return</button></div>`)}function showBreakRecap(r){const m=getMember(r.memberId);openModal('Break complete · '+(m?.name||'Team member'),`<div class="recap"><div class="recap-row"><span>Job / Station</span><b>${escapeHtml(r.job||'Not assigned')}</b></div><div class="recap-row"><span>Left at rotation</span><b>${r.startRotation}</b></div><div class="recap-row"><span>Returned at rotation</span><b>${r.endRotation}</b></div><div class="recap-row recap-total"><span>Rotations away</span><b>${r.rotations}</b></div>${r.notes?`<div><span class="muted small">Notes</span><div style="margin-top:4px">${escapeHtml(r.notes)}</div></div>`:''}</div><div class="actions"><button class="primary" onclick="closeModal()">Done</button></div>`)}function confirmEnd(id){const e=$('#endRotation').value.trim(),a=activeBreaks[id];if(!validRotation(e))return alert('Enter exactly 4 digits.');const record={id:crypto.randomUUID(),memberId:id,date:localDateKey(),job:a.job,startRotation:a.startRotation,endRotation:e,rotations:rotationDiff(a.startRotation,e),notes:a.notes,startedAt:a.startedAt,endedAt:new Date().toISOString()};breaks.unshift(record);delete activeBreaks[id];save();render();showBreakRecap(record)}
function editBreak(id){const r=breaks.find(x=>x.id===id);if(!r)return;openModal('Edit break · '+(getMember(r.memberId)?.name||'Team member'),`<div class="field"><label>Date</label><input id="editBreakDate" type="date" value="${r.date||localDateKey()}"></div><div class="field"><label>Job / Station</label><input id="editBreakJob" value="${escapeHtml(r.job||'')}"></div><div class="field"><label>Start rotation</label><input id="editBreakStart" class="big-rotation" maxlength="4" inputmode="numeric" value="${r.startRotation||''}"></div><div class="field"><label>Return rotation</label><input id="editBreakEnd" class="big-rotation" maxlength="4" inputmode="numeric" value="${r.endRotation||''}"></div><div class="field"><label>Notes</label><textarea id="editBreakNotes" rows="3">${escapeHtml(r.notes||'')}</textarea></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveBreakEdit('${id}')">Save Changes</button></div>`)}function saveBreakEdit(id){const r=breaks.find(x=>x.id===id);if(!r)return;const s=$('#editBreakStart').value.trim(),e=$('#editBreakEnd').value.trim();if(!validRotation(s)||!validRotation(e))return alert('Enter valid 4-digit rotation numbers.');r.date=$('#editBreakDate').value||r.date;r.job=$('#editBreakJob').value.trim();r.startRotation=s;r.endRotation=e;r.rotations=rotationDiff(s,e);r.notes=$('#editBreakNotes').value;r.edited=true;r.editedAt=new Date().toISOString();save();closeModal();render()}
function addRepair(){openModal('Choose repair type',`<div class="choice-grid"><button class="primary choice" onclick="repairForm('short')"><b>SHORT TERM</b><span>Rotation + issue</span></button><button class="secondary choice" onclick="repairForm('long')"><b>LONG TERM</b><span>Start, end + rotations involved</span></button></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button></div>`)}function repairForm(type,id=''){const r=id?repairs.find(x=>x.id===id):null,isShort=type==='short';openModal((r?'Edit ':'Add ')+(isShort?'short-term':'long-term')+' repair',`<div class="field"><label>Date</label><input id="repairDate" type="date" value="${r?.date||localDateKey()}"></div><div class="field"><label>${isShort?'Rotation':'Start rotation'}</label><input id="repairStart" class="big-rotation" maxlength="4" inputmode="numeric" value="${r?.startRotation||''}"></div>${isShort?'':`<div class="field"><label>End rotation</label><input id="repairEnd" class="big-rotation" maxlength="4" inputmode="numeric" value="${r?.endRotation||''}"></div><p class="muted small">Rotations involved calculate automatically, including 9999 → 6000 rollover.</p>`}<div class="field"><label>Issue${isShort?'':' / Repair Summary'}</label><textarea id="repairSummary" rows="3">${escapeHtml(r?.summary||'')}</textarea></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveRepair('${type}','${id}')">Save Repair</button></div>`)}function saveRepair(type,id){const s=$('#repairStart').value.trim(),summary=$('#repairSummary').value.trim(),isShort=type==='short',e=isShort?'':$('#repairEnd').value.trim();if(!validRotation(s)||(!isShort&&!validRotation(e)))return alert('Enter valid 4-digit rotation numbers.');if(!summary)return alert('Add the repair issue.');const obj=id?repairs.find(x=>x.id===id):{id:crypto.randomUUID(),createdAt:new Date().toISOString()};Object.assign(obj,{type,date:$('#repairDate').value||localDateKey(),startRotation:s,endRotation:e,rotations:isShort?'':rotationDiff(s,e),summary,edited:!!id});if(!id)repairs.unshift(obj);save();closeModal();render()}function editRepair(id){const r=repairs.find(x=>x.id===id);repairForm(r.type||'long',id)}function deleteRepair(id){if(confirm('Delete this repair record?')){repairs=repairs.filter(x=>x.id!==id);save();render()}}
function renderTeam(){$('#teamGrid').innerHTML=team.filter(m=>m.active!==false).map(m=>{const a=activeBreaks[m.id];return `<div class="member"><div class="member-top"><div class="name">${escapeHtml(m.name)}</div><span class="status">${a?'OUT':'AVAILABLE'}</span></div><div class="job-badge">Job: ${escapeHtml(m.job||'Not assigned')}</div>${a?`<div class="rot">Left rotation: <b>${a.startRotation}</b></div>`:'<div class="muted">Ready</div>'}<button class="primary" onclick="${a?`endBreak('${m.id}')`:`startBreak('${m.id}')`}">${a?'RETURN':'START BREAK'}</button></div>`}).join('')||'<div class="empty">Add team members under Manage.</div>'}function renderRepairs(){const date=$('#repairDateFilter')?.value||'',q=($('#repairSearch')?.value||'').toLowerCase();const rs=repairs.filter(r=>(!date||r.date===date)&&(!q||(r.summary||'').toLowerCase().includes(q)));$('#repairList').innerHTML=rs.map(r=>{const type=r.type||'long',short=type==='short';return `<div class="repair-card"><div class="repair-meta"><span class="type-pill ${short?'short':'long'}">${short?'SHORT TERM':'LONG TERM'}</span><span class="repair-pill">${r.date}</span><span class="repair-pill">${short?'Rot.':'Start Rot.'} ${r.startRotation}</span>${short?'':`<span class="repair-pill">End Rot. ${r.endRotation}</span><span class="repair-pill">${r.rotations} rotations involved</span>`}${r.edited?'<span class="edited">EDITED</span>':''}</div><div class="repair-summary">${escapeHtml(r.summary||'')}</div><div class="toolbar" style="margin-top:12px"><button class="secondary" onclick="editRepair('${r.id}')">Edit</button><button class="danger" onclick="deleteRepair('${r.id}')">Delete</button></div></div>`}).join('');$('#repairEmpty').style.display=rs.length?'none':'block'}function renderToday(){const rs=breaks.filter(r=>r.date===localDateKey());$('#todayList').innerHTML=rs.map(r=>`<div class="repair-card"><div class="member-top"><b>${escapeHtml(getMember(r.memberId)?.name||'Unknown')}</b><span class="job-badge">Job: ${escapeHtml(r.job||'Not assigned')}</span></div><div style="margin-top:8px">${r.startRotation} → ${r.endRotation} · ${r.rotations} rotations</div>${r.edited?'<div class="edited" style="margin-top:6px">EDITED</div>':''}${r.notes?`<div class="muted small" style="margin-top:6px">${escapeHtml(r.notes)}</div>`:''}</div>`).join('')||'<div class="empty">No completed breaks yet today.</div>'}function renderHistory(){$('#historyList').innerHTML=breaks.map(r=>`<div class="repair-card"><div class="member-top"><div>${r.date} · <b>${escapeHtml(getMember(r.memberId)?.name||'Unknown')}</b></div><span class="job-badge">Job: ${escapeHtml(r.job||'Not assigned')}</span></div><div style="margin-top:8px">${r.startRotation} → ${r.endRotation} · ${r.rotations} rotations</div>${r.edited?'<div class="edited" style="margin-top:6px">EDITED</div>':''}${r.notes?`<div class="muted small" style="margin-top:6px">${escapeHtml(r.notes)}</div>`:''}<div class="toolbar" style="margin-top:12px"><button class="secondary" onclick="editBreak('${r.id}')">Edit</button></div></div>`).join('')||'<div class="empty">No records.</div>'}function renderManage(){$('#memberList').innerHTML=team.map(m=>`<div class="manage-row"><b>${escapeHtml(m.name)}</b><div class="muted small">Job: ${escapeHtml(m.job||'Not assigned')}</div><div class="toolbar" style="margin-top:8px"><button class="secondary" onclick="changeJob('${m.id}')">Change Job</button></div></div>`).join('')}function addMember(){const e=$('#newMemberName'),n=e.value.trim();if(n){team.push({id:crypto.randomUUID(),name:n,job:'',active:true});e.value='';save();render()}}function changeJob(id){const m=getMember(id),j=prompt('Job / station:',m.job||'');if(j!==null){m.job=j.trim();save();render()}}
function makeCSV(rows){return rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}function downloadBlob(t,n,type){const b=new Blob([t],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click()}function exportCSV(){downloadBlob(makeCSV([['Date','Team Member','Job','Start Rotation','End Rotation','Rotations','Notes'],...breaks.map(r=>[r.date,getMember(r.memberId)?.name||'',r.job,r.startRotation,r.endRotation,r.rotations,r.notes])]),'rotation-break-history.csv','text/csv')}function exportRepairsCSV(){downloadBlob(makeCSV([['Date','Type','Start/Event Rotation','End Rotation','Rotations Involved','Issue'],...repairs.map(r=>[r.date,r.type||'long',r.startRotation,r.endRotation||'',r.rotations??'',r.summary])]),'rotation-repair-history.csv','text/csv')}function exportBackup(){downloadBlob(JSON.stringify({version:5,team,breaks,activeBreaks,repairs},null,2),'rotation-break-backup.json','application/json')}function renderStats(){const today=localDateKey(),br=breaks.filter(r=>r.date===today);$('#outCount').textContent=Object.keys(activeBreaks).length;$('#todayCount').textContent=br.length;$('#todayRotations').textContent=br.reduce((s,r)=>s+Number(r.rotations||0),0);$('#repairCount').textContent=repairs.filter(r=>r.date===today).length}function render(){renderTeam();renderToday();renderRepairs();renderHistory();renderManage();renderStats()}$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.section').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.tab).classList.add('active')});$('#repairDateFilter').onchange=renderRepairs;$('#repairSearch').oninput=renderRepairs;function clock(){$('#liveTime').textContent=new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'})}clock();setInterval(clock,1000);render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script></body></html>
